name: GH pages update for CFPDB
run-name: ${{ github.actor }} is updating GH pages for CFPDB
on:
  push:
    branches:
      - 'conferences'
  schedule:
    - cron: '0 2 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:  # Disable concurrent runs
  group: cfpdb-gh-pages-update
  cancel-in-progress: false
jobs:
  update_GH_pages_for_CFPDB:
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run update script
        run: python3 update_cfpdb_on_github.py
        env:
          work_dir: cfpdb_repo
          repo_url: https://github.com/${{ github.repository }}.git
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
